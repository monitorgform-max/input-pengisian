<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#8203;</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            perspective: 1200px;
        }

        /* --- EFEK BIOSKOP (LAYAR LEBAR) --- */
        .cinematic-bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 12vh;
            background-color: #000;
            z-index: 100;
            transition: height 0.5s ease;
        }
        .bar-top { top: 0; }
        .bar-bottom { bottom: 0; }

        /* --- KOTAK 3D KAYU --- */
        #scene-box {
            position: absolute;
            width: 130px;
            height: 130px;
            transform-style: preserve-3d;
            transform: translateY(-130vh) rotateX(-30deg) rotateY(45deg);
        }

        .face {
            position: absolute;
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #4A2E18, #2B190D);
            border: 2px solid #1A0F08;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .front  { transform: translateZ(65px); }
        .back   { transform: rotateY(180deg) translateZ(65px); }
        .right  { transform: rotateY(90deg) translateZ(65px); }
        .left   { transform: rotateY(-90deg) translateZ(65px); }
        .top    { transform: rotateX(90deg) translateZ(65px); background: #613C20; }
        .bottom { transform: rotateX(-90deg) translateZ(65px); background: #1A0F08; }

        /* Animasi Jatuh Sinematik */
        .jatuh-cinematic {
            animation: cinematicDrop 1.1s cubic-bezier(0.6, 0.04, 0.98, 0.33) forwards;
        }

        /* Goyang Kiri Kanan Ekstrem */
        .goyang-ekstrem {
            animation: violentShake 0.1s infinite;
        }

        /* --- EFEK FLASH LEDAKAN --- */
        #flash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }
        .flash-active {
            animation: flashExplosion 0.4s ease-out forwards;
        }

        /* --- LAYAR DARAH --- */
        #blood-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(90,2,2,0.9) 0%, rgba(30,0,0,0.98) 70%, rgba(10,0,0,1) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s ease-in;
        }
        .blood-active {
            opacity: 1;
        }

        .splatter {
            position: absolute;
            background-color: #4a0101;
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.85;
        }

        /* --- TEKS DRAMATIS FILM --- */
        #teks-ending {
            color: #d1d1d1;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 25px #ff0000, 0 0 10px #000;
            opacity: 0;
            transform: scale(0.9);
            z-index: 60;
            text-align: center;
            padding: 0 20px;
        }

        .tampil-teks-film {
            animation: movieTitleFade 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* --- ANIMASI KEYFRAMES --- */
        @keyframes cinematicDrop {
            0% { transform: translateY(-130vh) rotateX(-60deg) rotateY(90deg); }
            85% { transform: translateY(15px) rotateX(5deg) rotateY(-5deg); }
            100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
        }

        @keyframes violentShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-12px, 5deg) rotate(-8deg); }
            40% { transform: translate(12px, -5deg) rotate(8deg); }
            60% { transform: translate(-8px, -3deg) rotate(-5deg); }
            80% { transform: translate(8px, 3deg) rotate(5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes flashExplosion {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes movieTitleFade {
            0% { opacity: 0; transform: scale(0.85); letter-spacing: 1px; }
            50% { opacity: 1; }
            100% { opacity: 1; transform: scale(1); letter-spacing: 4px; }
        }

        /* Efek Guncangan Seluruh Layar */
        .body-shake {
            animation: bodyShakeAnim 0.3s ease;
        }
        @keyframes bodyShakeAnim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(5px, 5px); }
            50% { transform: translate(-5px, -5px); }
            75% { transform: translate(3px, -3px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <!-- Bar Bioskop -->
    <div class="cinematic-bar bar-top"></div>
    <div class="cinematic-bar bar-bottom"></div>

    <!-- Flash & Layar Darah -->
    <div id="flash-screen"></div>
    <div id="blood-screen">
        <div id="teks-ending">I'M BROKEN INSIDE</div>
    </div>

    <!-- Kotak 3D -->
    <div id="scene-box">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
    </div>

    <script>
        const sceneBox = document.getElementById('scene-box');
        const flashScreen = document.getElementById('flash-screen');
        const bloodScreen = document.getElementById('blood-screen');
        const teksEnding = document.getElementById('teks-ending');
        const body = document.body;

        window.onload = () => {
            // SCENE 1: Kotak jatuh dari atas
            sceneBox.classList.add('jatuh-cinematic');

            // SCENE 2: Benturan & Goyang ekstrem di dasar
            setTimeout(() => {
                sceneBox.classList.remove('jatuh-cinematic');
                sceneBox.classList.add('goyang-ekstrem');
                body.classList.add('body-shake'); // Layar ikut gempa pas jatuh
            }, 1100);

            // SCENE 3: BOOM! Ledakan, Flash Putih, Darah Muncrat
            setTimeout(() => {
                sceneBox.style.display = 'none'; // Kotak hancur/hilang seketika
                body.classList.remove('body-shake');
                
                // Kilatan cahaya ledakan
                flashScreen.classList.add('flash-active');

                // Layar berubah jadi genangan darah
                bloodScreen.classList.add('blood-active');
                bikinBercakDarahCinematic();

                // SCENE 4: Teks muncul pelan dramatis di atas darah
                setTimeout(() => {
                    teksEnding.classList.add('tampil-teks-film');
                }, 600);

            }, 2800); // Durasi tegang goyang sebelum meledak
        };

        // Bikin cipratan darah artistik ala film horor/thriller
        function bikinBercakDarahCinematic() {
            for (let i = 0; i < 35; i++) {
                const s = document.createElement('div');
                s.classList.add('splatter');
                const size = Math.random() * 100 + 20 + 'px';
                s.style.width = size;
                s.style.height = size;
                s.style.top = Math.random() * 100 + 'vh';
                s.style.left = Math.random() * 100 + 'vw';
                bloodScreen.appendChild(s);
            }
        }
    </script>
</body>
</html>
