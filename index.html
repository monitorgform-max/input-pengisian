<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#8203;</title>
    <style>
        /* --- SETUP LAYAR BIOSKOP --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; /* Hitam pekat */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- BOX KAYU --- */
        #box {
            width: 120px;
            height: 120px;
            background-color: #5C3A21;
            border: 6px solid #3E2312;
            position: absolute;
            bottom: 20vh; /* Jatuh ke area bawah layar */
            /* Tekstur kayu simpel pake gradient */
            background-image: repeating-linear-gradient(
                45deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 10px,
                transparent 10px,
                transparent 20px
            );
            transform: translateY(-100vh); /* Posisi awal di atas langit */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Animasi Jatuh */
        .jatuh {
            animation: dropAnimation 1s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
        }

        /* Animasi Goyang (Shake) */
        .goyang {
            animation: shakeAnimation 0.1s infinite;
        }

        /* --- TEKS ENDING --- */
        #teks-ending {
            position: absolute;
            color: #8a0303; /* Merah darah */
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(138, 3, 3, 0.8);
            transform: translateY(-100vh);
            opacity: 0;
            text-align: center;
            padding: 0 20px;
        }

        .turun-teks {
            animation: textDrop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* --- PARTIKEL LEDAKAN (DARAH & HATI) --- */
        .particle {
            position: absolute;
            bottom: 25vh; /* Titik ledakan sama dengan posisi box */
            left: 50%;
            pointer-events: none;
            opacity: 1;
            transform: translate(-50%, -50%) scale(0);
        }

        .blood {
            background-color: #8a0303;
            border-radius: 50%;
        }

        .heart {
            font-size: 2rem;
            color: #ff0000;
        }

        .explode-anim {
            animation: shoot 1s ease-out forwards;
        }

        /* --- KEYFRAMES --- */
        @keyframes dropAnimation {
            0% { transform: translateY(-100vh) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        @keyframes shakeAnimation {
            0% { transform: translateY(0) translate(2px, 1px) rotate(0deg); }
            10% { transform: translateY(0) translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translateY(0) translate(-3px, 0px) rotate(1deg); }
            30% { transform: translateY(0) translate(0px, 2px) rotate(0deg); }
            40% { transform: translateY(0) translate(1px, -1px) rotate(1deg); }
            50% { transform: translateY(0) translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translateY(0) translate(-3px, 1px) rotate(0deg); }
            70% { transform: translateY(0) translate(2px, 1px) rotate(-1deg); }
            80% { transform: translateY(0) translate(-1px, -1px) rotate(1deg); }
            90% { transform: translateY(0) translate(2px, 2px) rotate(0deg); }
            100% { transform: translateY(0) translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes textDrop {
            0% { transform: translateY(-50vh); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes shoot {
            0% { 
                transform: translate(-50%, -50%) scale(1); 
                opacity: 1;
            }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(var(--s)); 
                opacity: 0;
            }
        }

        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Properti Scene -->
    <div id="box"></div>
    <div id="teks-ending">I'M BROKEN INSIDE</div>

    <script>
        const box = document.getElementById('box');
        const teksEnding = document.getElementById('teks-ending');

        // ALUR CERITA (TIMELINE SUTRADARA)
        window.onload = () => {
            // SCENE 1: Detik ke-0, Box jatuh
            box.classList.add('jatuh');

            // SCENE 2: Detik ke-1, Box nyampe tanah dan goyang-goyang
            setTimeout(() => {
                box.classList.remove('jatuh');
                box.classList.add('goyang');
            }, 1000);

            // SCENE 3: Detik ke-3.5, Box meledak!
            setTimeout(() => {
                box.classList.add('hidden'); // Box hilang
                ledakanDarahDanHati();       // Muncratan partikel
            }, 3500);

            // SCENE 4: Detik ke-4, Teks turun
            setTimeout(() => {
                teksEnding.classList.add('turun-teks');
            }, 4000);
        };

        // EFEK SPESIAL (VFX) LEDAKAN
        function ledakanDarahDanHati() {
            // Bikin partikel Darah
            for (let i = 0; i < 40; i++) {
                bikinPartikel('blood');
            }
            // Bikin partikel Hati Patah
            for (let i = 0; i < 15; i++) {
                bikinPartikel('heart');
            }
        }

        function bikinPartikel(tipe) {
            const particle = document.createElement('div');
            particle.classList.add('particle', 'explode-anim');

            if (tipe === 'blood') {
                particle.classList.add('blood');
                // Ukuran darah random (3px - 15px)
                const size = Math.random() * 12 + 3 + 'px';
                particle.style.width = size;
                particle.style.height = size;
            } else if (tipe === 'heart') {
                particle.classList.add('heart');
                particle.innerText = '💔';
                // Ukuran hati random
                particle.style.fontSize = Math.random() * 1.5 + 1 + 'rem';
            }

            // Hitung arah ledakan menyebar (X dan Y acak buat lemparan)
            // Nilai X antara -300px sampe 300px
            // Nilai Y antara -400px (ke atas) sampe 100px (ke bawah)
            const tx = (Math.random() - 0.5) * 600 + 'px';
            const ty = (Math.random() - 1) * 500 + 'px';
            const scale = Math.random() * 1.5 + 0.5;

            // Masukin nilai arah ledakan ke CSS Variable
            particle.style.setProperty('--tx', tx);
            particle.style.setProperty('--ty', ty);
            particle.style.setProperty('--s', scale);

            document.body.appendChild(particle);

            // Hapus sisa partikel biar ga menuh-menuhin memori browser
            particle.addEventListener('animationend', () => {
                particle.remove();
            });
        }
    </script>
</body>
</html>
