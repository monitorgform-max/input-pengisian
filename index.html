<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#8203;</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- HATI YANG JATUH --- */
        #falling-heart {
            position: absolute;
            font-size: 5rem;
            animation: dropHeart 1s cubic-bezier(0.5, 0, 0.75, 1) forwards;
            z-index: 10;
        }

        @keyframes dropHeart {
            0% { transform: translateY(-120vh) scale(0.8) rotate(-15deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* Animasi Goyang */
        .goyang-hati {
            animation: shakeHeart 0.1s infinite;
        }

        @keyframes shakeHeart {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-8px, 4px) rotate(-8deg); }
            50% { transform: translate(8px, -4px) rotate(8deg); }
            75% { transform: translate(-4px, -2px) rotate(-4deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* --- LAYAR DARAH --- */
        #blood-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(120,0,0,0.95) 0%, rgba(40,0,0,0.98) 70%, rgba(10,0,0,1) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in;
        }

        #blood-screen.aktif {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- TEKS DRAMATIS AKHIR --- */
        #teks-ending {
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 25px #ff0000, 0 0 10px #000;
            z-index: 60;
            opacity: 0;
            transform: scale(0.5);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease;
            text-align: center;
            padding: 0 20px;
        }

        #teks-ending.tampil-teks {
            opacity: 1;
            transform: scale(1);
        }

        /* Partikel Pecahan */
        .shards {
            position: absolute;
            pointer-events: none;
            z-index: 55;
        }
    </style>
</head>
<body>

    <!-- Hati Merah yang Jatuh -->
    <div id="falling-heart">❤️</div>

    <!-- Layar Darah & Teks -->
    <div id="blood-screen">
        <div id="teks-ending">I'M BROKEN INSIDE</div>
    </div>

    <script>
        const heart = document.getElementById('falling-heart');
        const bloodScreen = document.getElementById('blood-screen');
        const teksEnding = document.getElementById('teks-ending');

        // Begitu hati selesai jatuh ke dasar...
        heart.addEventListener('animationend', (e) => {
            if (e.animationName === 'dropHeart') {
                heart.classList.add('goyang-hati');

                // Goyang selama 1.5 detik, lalu BOOM MELEDAK!
                setTimeout(() => {
                    const rect = heart.getBoundingClientRect();
                    const startX = rect.left + rect.width / 2;
                    const startY = rect.top + rect.height / 2;

                    heart.style.display = 'none'; // Hati utuh hilang
                    bloodScreen.classList.add('aktif'); // Munculkan layar darah dengan mulus

                    // Ledakan pecahan hati & darah
                    for (let i = 0; i < 20; i++) {
                        bikinPartikel(startX, startY, '💔', true);
                    }
                    for (let i = 0; i < 40; i++) {
                        bikinPartikel(startX, startY, 'blood', false);
                    }

                    // Teks langsung muncul nge-zoom
                    setTimeout(() => {
                        teksEnding.classList.add('tampil-teks');
                    }, 200);

                }, 1500);
            }
        });

        function bikinPartikel(x, y, tipe, isEmoji) {
            const p = document.createElement('div');
            p.classList.add('shards');
            p.style.left = x + 'px';
            p.style.top = y + 'px';

            if (isEmoji) {
                p.innerText = tipe;
                p.style.fontSize = Math.random() * 1.5 + 0.8 + 'rem';
            } else {
                p.style.backgroundColor = Math.random() > 0.3 ? '#8a0303' : '#ff1a1a';
                p.style.borderRadius = '50%';
                const size = Math.random() * 14 + 4 + 'px';
                p.style.width = size;
                p.style.height = size;
            }

            document.body.appendChild(p);

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 400 + 50;
            const targetX = Math.cos(angle) * distance;
            const targetY = Math.sin(angle) * distance;

            p.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                { transform: `translate(${targetX}px, ${targetY}px) scale(0.2)`, opacity: 0 }
            ], {
                duration: Math.random() * 800 + 600,
                easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
            }).onfinish = () => p.remove();
        }
    </script>
</body>
</html>
