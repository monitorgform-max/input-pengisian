<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#8203;</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            perspective: 1000px;
        }

        /* --- KOTAK 3D KAYU --- */
        #scene-box {
            position: absolute;
            width: 130px;
            height: 130px;
            transform-style: preserve-3d;
            transform: translateY(-150vh) rotateX(-30deg) rotateY(45deg);
        }

        .face {
            position: absolute;
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #5C3A21, #3E2312);
            border: 2px solid #1A0F08;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
        }

        .front  { transform: translateZ(65px); }
        .back   { transform: rotateY(180deg) translateZ(65px); }
        .right  { transform: rotateY(90deg) translateZ(65px); }
        .left   { transform: rotateY(-90deg) translateZ(65px); }
        .top    { transform: rotateX(90deg) translateZ(65px); background: #704629; }
        .bottom { transform: rotateX(-90deg) translateZ(65px); background: #2B190D; }

        /* Animasi Jatuh */
        .jatuh {
            animation: dropBox 1s cubic-bezier(0.5, 0, 0.75, 1) forwards;
        }

        @keyframes dropBox {
            0% { transform: translateY(-150vh) rotateX(-60deg) rotateY(90deg); }
            100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
        }

        /* Animasi Goyang Kiri-Kanan */
        .goyang {
            animation: shakeBox 0.12s infinite;
        }

        @keyframes shakeBox {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 4px) rotate(-6deg); }
            50% { transform: translate(10px, -4px) rotate(6deg); }
            75% { transform: translate(-6px, -2px) rotate(-3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* --- LAYAR DARAH & CIPRATAN --- */
        #blood-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(90,2,2,0.95) 0%, rgba(35,0,0,0.98) 70%, rgba(10,0,0,1) 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .splatter {
            position: absolute;
            background-color: #3b0101;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.9;
        }

        /* --- TEKS DRAMATIS --- */
        #teks-ending {
            color: #ffffff;
            font-size: 3.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 25px #ff0000, 0 0 10px #000;
            z-index: 60;
            opacity: 0;
            transform: scale(0.6);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            padding: 0 20px;
        }

        .tampil-teks {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
    </style>
</head>
<body>

    <!-- Kotak 3D -->
    <div id="scene-box" class="jatuh">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
    </div>

    <!-- Layar Darah -->
    <div id="blood-screen">
        <div id="teks-ending">I'M BROKEN INSIDE</div>
    </div>

    <script>
        const box = document.getElementById('scene-box');
        const bloodScreen = document.getElementById('blood-screen');
        const teksEnding = document.getElementById('teks-ending');

        // Begitu animasi kotak selesai jatuh ke tanah...
        box.addEventListener('animationend', (e) => {
            if (e.animationName === 'dropBox') {
                // Langsung ganti ke mode goyang-goyang
                box.classList.remove('jatuh');
                box.classList.add('goyang');

                // Goyang selama 2 detik, lalu BOOM meledak!
                setTimeout(() => {
                    box.style.display = 'none'; // Kotak hancur
                    bloodScreen.style.display = 'flex'; // Layar berubah jadi darah

                    // Generate cipratan darah acak di layar
                    for (let i = 0; i < 35; i++) {
                        const s = document.createElement('div');
                        s.classList.add('splatter');
                        const size = Math.random() * 90 + 20 + 'px';
                        s.style.width = size;
                        s.style.height = size;
                        s.style.top = Math.random() * 100 + 'vh';
                        s.style.left = Math.random() * 100 + 'vw';
                        bloodScreen.appendChild(s);
                    }

                    // Teks muncul dramatis sesudah layar berdarah
                    setTimeout(() => {
                        teksEnding.classList.add('tampil-teks');
                    }, 300);

                }, 2000);
            }
        });
    </script>
</body>
</html>
