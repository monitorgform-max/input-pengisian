<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#8203;</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            perspective: 1000px; /* Bikin efek 3D */
        }

        /* --- KOTAK 3D KAYU --- */
        #scene-box {
            position: absolute;
            width: 120px;
            height: 120px;
            transform-style: preserve-3d;
            transform: translateY(-120vh) rotateX(-20deg) rotateY(30deg);
        }

        /* Sisi-sisi Kotak 3D */
        .face {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #5C3A21;
            border: 2px solid #3E2312;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
        }

        .front  { transform: translateZ(60px); }
        .back   { transform: rotateY(180deg) translateZ(60px); }
        .right  { transform: rotateY(90deg) translateZ(60px); }
        .left   { transform: rotateY(-90deg) translateZ(60px); }
        .top    { transform: rotateX(90deg) translateZ(60px); background: #704629; }
        .bottom { transform: rotateX(-90deg) translateZ(60px); background: #3E2312; }

        /* Animasi Jatuh 3D */
        .jatuh-3d {
            animation: dropBox 1.2s cubic-bezier(0.5, 0.05, 0.5, 1.1) forwards;
        }

        /* Animasi Goyang Kiri Kanan */
        .goyang-kiri-kanan {
            animation: shakeBox 0.15s infinite;
        }

        /* --- LAYAR BERLUMURAN DARAH (SPLATTER) --- */
        #blood-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(138,3,3,0.8) 0%, rgba(60,1,1,0.95) 70%, rgba(20,0,0,1) 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .blood-splash-active {
            opacity: 1 !important;
            animation: screenPulse 0.5s ease-out;
        }

        /* Efek Cipratan Darah Tambahan di Layar */
        .splatter-spot {
            position: absolute;
            background-color: #610202;
            border-radius: 50%;
            opacity: 0.85;
        }

        /* --- TEKS DRAMATIS --- */
        #teks-ending {
            color: #ffffff;
            font-size: 3.2rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0000, 2px 2px 5px #000;
            opacity: 0;
            transform: scale(0.8);
            z-index: 10;
            text-align: center;
            padding: 0 20px;
        }

        .tampil-teks {
            animation: textZoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* --- KEYFRAMES ANIMASI --- */
        @keyframes dropBox {
            0% { transform: translateY(-120vh) rotateX(-40deg) rotateY(45deg); }
            80% { transform: translateY(20px) rotateX(0deg) rotateY(0deg); }
            100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
        }

        @keyframes shakeBox {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            25% { transform: translateY(0) rotate(-6deg) translateX(-8px); }
            50% { transform: translateY(0) rotate(0deg) translateX(0); }
            75% { transform: translateY(0) rotate(6deg) translateX(8px); }
            100% { transform: translateY(0) rotate(0deg) translateX(0); }
        }

        @keyframes screenPulse {
            0% { transform: scale(1.05); }
            50% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }

        @keyframes textZoomIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Kotak 3D -->
    <div id="scene-box">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
    </div>

    <!-- Layar Darah & Teks -->
    <div id="blood-screen">
        <div id="teks-ending">I'M BROKEN INSIDE</div>
    </div>

    <script>
        const sceneBox = document.getElementById('scene-box');
            const bloodScreen = document.getElementById('blood-screen');
        const teksEnding = document.getElementById('teks-ending');

        window.onload = () => {
            // SCENE 1: Kotak 3D jatuh dari langit
            sceneBox.classList.add('jatuh-3d');

            // SCENE 2: Sesampainya di dasar, mulai goyang kiri-kanan
            setTimeout(() => {
                sceneBox.classList.remove('jatuh-3d');
                sceneBox.classList.add('goyang-kiri-kanan');
            }, 1200);

            // SCENE 3: BOOM! Meledak jadi darah
            setTimeout(() => {
                sceneBox.classList.add('hidden'); // Kotak hancur/hilang
                
                // Layar berubah berlumuran darah
                bloodScreen.classList.add('blood-splash-active');
                bikinCipratanDarahRandom();

                // SCENE 4: Teks muncul di atas darah
                setTimeout(() => {
                    teksEnding.classList.add('tampil-teks');
                }, 400);

            }, 3200); // Durasi tegang goyang sekitar 2 detik
        };

        // Fungsi nambahin detail cipratan darah acak di layar
        function bikinCipratanDarahRandom() {
            for (let i = 0; i < 25; i++) {
                const spot = document.createElement('div');
                spot.classList.add('splatter-spot');
                
                const size = Math.random() * 80 + 20 + 'px';
                spot.style.width = size;
                spot.style.height = size;
                spot.style.top = Math.random() * 100 + 'vh';
                spot.style.left = Math.random() * 100 + 'vw';
                spot.style.filter = 'blur(2px)';
                
                bloodScreen.appendChild(spot);
            }
        }
    </script>
</body>
</html>
